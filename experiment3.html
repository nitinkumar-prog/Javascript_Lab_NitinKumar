<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM Modern Demo</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 25px;
            background: #4facfe;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #007bff;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2> BOM Demo (Modern UI)</h2>

        <button onclick="showWindow()"> Window Info</button>
        <button onclick="showHistory()">History Info</button>
        <button onclick="showNavigator()"> Navigator Info</button>
        <button onclick="showScreen()">🖥Screen Info</button>
    </div>

    <script>
        function showWindow() {
            alert(
                "Window Width: " + window.innerWidth +
                "\nWindow Height: " + window.innerHeight
            );
        }

        function showHistory() {
            alert("Number of pages visited: " + history.length);
        }

        function showNavigator() {
            alert(
                "Browser Name: " + navigator.appName +
                "\nVersion: " + navigator.appVersion +
                "\nUser Agent: " + navigator.userAgent
            );
        }

        function showScreen() {
            alert(
                "Screen Width: " + screen.width +
                "\nScreen Height: " + screen.height +
                "\nColor Depth: " + screen.colorDepth
            );
        }
    </script>

</body>
</html>
